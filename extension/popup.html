<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Chat</title>
    <style>
      :root {
        --bg: #ffffff;
        --panel: #f4f5f7;
        --text: #1f2328;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-text: #ffffff;
        --system: #9ca3af;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 340px;
        height: 460px;
        font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      header {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .title {
        font-weight: 700;
        font-size: 14px;
      }

      .count-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--accent);
        color: var(--accent-text);
        padding: 3px 9px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 12px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34d399;
        display: inline-block;
      }

      .room-label {
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
      }

      .status.err {
        color: #dc2626;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .msg {
        max-width: 85%;
      }

      .msg .name {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 2px;
      }

      .msg .bubble {
        background: var(--panel);
        padding: 6px 9px;
        border-radius: 10px;
        word-break: break-word;
        white-space: pre-wrap;
        line-height: 1.4;
      }

      .msg.self {
        align-self: flex-end;
        text-align: right;
      }

      .msg.self .bubble {
        background: var(--accent);
        color: var(--accent-text);
      }

      .msg.system {
        align-self: center;
        max-width: 100%;
      }

      .msg.system .bubble {
        background: transparent;
        color: var(--system);
        font-size: 11px;
        padding: 2px 0;
      }

      form {
        display: flex;
        gap: 6px;
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }

      #input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        outline: none;
        background: #fff;
        color: var(--text);
      }

      #input:focus {
        border-color: var(--accent);
      }

      button {
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-text);
        padding: 0 14px;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="title-row">
          <span class="title">Tab Chat</span>
          <span class="count-badge">
            <span class="dot"></span>
            <span id="count">-</span> 人
          </span>
        </div>
        <div class="room-label" id="room-label" title="">ルームを判定中…</div>
        <div class="status" id="status">接続中…</div>
      </header>

      <div class="messages" id="messages"></div>

      <form id="chat-form" autocomplete="off">
        <input
          type="text"
          id="input"
          placeholder="メッセージを入力…"
          maxlength="1000"
          disabled
        />
        <button type="submit" id="send" disabled>送信</button>
      </form>
    </div>

    <!-- Socket.io クライアント(ローカルにバンドル) -->
    <script src="lib/socket.io.min.js"></script>
    <!-- ルームID正規化ロジック(共通) -->
    <script src="roomId.js"></script>
    <!-- ポップアップ本体 -->
    <script src="popup.js"></script>
  </body>
</html>
